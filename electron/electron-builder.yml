appId: com.donjet.open-prd
productName: OpenPRD
directories:
  buildResources: build
  output: release/${version}
files:
  - out/
  - "!out/**/*.map"
extraResources:
  - from: ../frontend/dist/
    to: frontend/dist/
  - from: ../backend/dist/
    to: backend/dist/
  # 内置 Skill（只读）；打包后 <resources>/skills 与 backend 内置目录解析结果一致。
  # 其中遗留的 skill-custom-* 会在首次启动时被迁移脚本拷入 userData。
  - from: ../skills/
    to: skills/
win:
  target:
    - target: nsis
      arch: [x64]
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  target:
    - target: AppImage
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
