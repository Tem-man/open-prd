<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Open PRD">
  <title>Open PRD</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7278FA"/>
      <stop offset=".48" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#3B2FB0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".22" cy=".12" r=".9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFF1FF"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.2" flood-color="#211A68" flood-opacity=".38"/>
    </filter>
    <clipPath id="tileClip">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="64" height="64" fill="url(#tile)"/>
    <rect width="64" height="64" fill="url(#glow)"/>
    <path d="M-10 40 L40 -10 L54 -10 L-10 54 Z" fill="#FFFFFF" opacity=".05"/>

    <!-- Prototype canvas layer behind the document -->
    <g transform="rotate(9 43 36)">
      <rect x="30" y="19" width="26" height="33" rx="5.5" fill="#FFFFFF" fill-opacity=".16"
            stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.6"/>
      <rect x="50" y="46" width="4.6" height="4.6" rx="1.2" fill="#FFFFFF" fill-opacity=".9"/>
    </g>

    <!-- PRD document with a folded corner -->
    <g filter="url(#shadow)">
      <path d="M22 12 H33 L46 25 V46 A6 6 0 0 1 40 52 H22 A6 6 0 0 1 16 46 V18 A6 6 0 0 1 22 12 Z"
            fill="url(#paper)"/>
    </g>
    <path d="M33 12 L46 25 H36 A3 3 0 0 1 33 22 Z" fill="#C7CDFB"/>

    <!-- Document text lines -->
    <g fill="#4F46E5">
      <rect x="22" y="29" width="18" height="3.2" rx="1.6"/>
      <rect x="22" y="36" width="18" height="3.2" rx="1.6" opacity=".85"/>
      <rect x="22" y="43" width="10.5" height="3.2" rx="1.6" opacity=".38"/>
    </g>

    <!-- AI sparkle -->
    <path d="M50.5 8.5 C50.9 12.3 52.7 14.1 56.5 14.5 C52.7 14.9 50.9 16.7 50.5 20.5
             C50.1 16.7 48.3 14.9 44.5 14.5 C48.3 14.1 50.1 12.3 50.5 8.5 Z"
          fill="#FFFFFF" opacity=".95"/>
  </g>

  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.3" fill="none"
        stroke="#FFFFFF" stroke-opacity=".22" stroke-width="1.5"/>
</svg>
