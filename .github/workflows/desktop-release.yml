name: Desktop Release (Windows / macOS / Linux)

# 为什么必须有这条流水线：
#   macOS dmg 依赖 hdiutil（只有 macOS 有），AppImage / deb 依赖原生 Linux 工具链。
#   在 Windows 上交叉构建出来的 mac/Linux 包不可靠，统一交给 GitHub 原生 runner。
#   Windows NSIS + portable 同样在这里构建，三平台发版保持同一份代码、同一个版本号。
#
# 触发方式：
#   1) Actions 页面手动 "Run workflow"（默认构建 macOS arm64 + Linux x64，产物在 Artifacts）
#      platform 可选 windows / mac / linux / mac-linux / all
#   2) push v* tag → 构建 Windows x64 + macOS arm64/x64 + Linux x64，并自动发布 GitHub Release
#
# 产物都是「未签名」的：仓库没有 Apple Developer / Windows 代码签名证书。
#   mac 包首次打开需要右键 → 打开，或执行 `xattr -cr /Applications/OpenPRD.app`。

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台（all = 全部目标，含 Windows）"
        required: true
        default: mac-linux
        type: choice
        options:
          - mac-linux
          - windows
          - mac
          - linux
          - all
      mac_arch:
        description: "macOS 架构（默认 arm64 = Apple Silicon）"
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64
          - both
      linux_arch:
        description: "Linux 架构（arm64 为实验性，AppImage 工具链对 arm64 支持有限）"
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64
          - both
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # job 级 if 里拿不到 matrix 上下文（只有 github / needs / vars / inputs），
  # 所以先在这里把要跑的目标算成 JSON，再由 build 用 fromJSON 展开成 matrix。
  prepare:
    name: Select build targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Compute matrix
        id: select
        shell: bash
        env:
          WF_EVENT: ${{ github.event_name }}
          WF_PLATFORM: ${{ inputs.platform }}
          WF_MAC_ARCH: ${{ inputs.mac_arch }}
          WF_LINUX_ARCH: ${{ inputs.linux_arch }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const all = [
            { id: 'macos-arm64', name: 'macOS arm64 (Apple Silicon)', os: 'macos-15',         group: 'mac',   platform: 'darwin', arch: 'arm64', release: true  },
            { id: 'macos-x64',   name: 'macOS x64 (Intel)',           os: 'macos-15-intel',   group: 'mac',   platform: 'darwin', arch: 'x64',   release: true  },
            { id: 'linux-x64',   name: 'Linux x64',                    os: 'ubuntu-24.04',     group: 'linux', platform: 'linux',  arch: 'x64',   release: true  },
            { id: 'linux-arm64', name: 'Linux arm64',                  os: 'ubuntu-24.04-arm', group: 'linux', platform: 'linux',  arch: 'arm64', release: false },
            { id: 'windows-x64', name: 'Windows x64',                  os: 'windows-latest',   group: 'windows', platform: 'win32',  arch: 'x64',   release: true  },
          ];

          let selected;
          if (process.env.WF_EVENT === 'push') {
            // 打 tag 发版：Windows x64 + mac 双架构 + Linux x64，不跑实验性的 linux-arm64
            selected = all.filter(t => t.release);
          } else {
            const platform = process.env.WF_PLATFORM || 'mac-linux';
            const macArch = process.env.WF_MAC_ARCH || 'arm64';
            const linuxArch = process.env.WF_LINUX_ARCH || 'x64';
            selected = all.filter(t => {
              const inPlatform = platform === 'all'
                || (platform === 'mac-linux' && t.group !== 'windows')
                || platform === t.group;
              if (!inPlatform) return false;
              if (t.group === 'windows') return true;
              const want = t.group === 'mac' ? macArch : linuxArch;
              return want === 'both' || want === t.arch;
            });
          }

          if (!selected.length) {
            console.error('::error::没有任何构建目标被选中，请检查 workflow_dispatch 输入');
            process.exit(1);
          }
          const matrix = JSON.stringify({ include: selected });
          console.log('选中的构建目标：' + selected.map(t => t.id).join(', '));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + matrix + '\n');
          NODE

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm-lock.yaml 是 lockfileVersion '9.0'，必须用 pnpm 9；
          # pnpm 10+ 的 deploy 默认行为变了，会报 ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE。
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 固定 24.9.0，与本机保持一致（better-sqlite3 原生 ABI 敏感）
          node-version-file: .nvmrc
          cache: pnpm

      - name: Verify bundled icons
        shell: bash
        # electron/build/icon.ico|icns|png 均已随仓库提交。
        # 故意不在 CI 里跑 `pnpm icon`：它需要 headless Chrome 和 `python` 命令，
        # macOS runner 上不保证存在，且跨平台渲染结果可能和已提交的图标不一致。
        run: |
          set -euo pipefail
          for f in icon.ico icon.icns icon.png; do
            if [ ! -s "electron/build/$f" ]; then
              echo "::error::缺少 electron/build/$f，请先在本地执行 pnpm icon 并提交"
              exit 1
            fi
          done
          echo "图标资源完整，直接使用仓库内已提交的版本"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        # electron-builder 26 默认用 legacy FUSE2 AppImage 工具链（toolset 0.0.0），
        # appimagetool 本身是 AppImage，构建时需要 libfuse.so.2。
        # Ubuntu 24.04 起包名改为 libfuse2t64。
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          ldconfig -p | grep -q 'libfuse.so.2' || {
            echo "::error::libfuse.so.2 未就绪，AppImage 构建会失败"
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.name }}
        shell: bash
        # 直接调脚本入口，不用 `pnpm dist:mac -- --arch=...`：
        # pnpm 会吞掉 `--` 后的参数，可能静默按宿主架构打包（产物名却是另一个架构）。
        run: node scripts/build-desktop.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
        env:
          # 仓库未配 Apple 证书，禁止 electron-builder 在 CI 上自动找证书做签名
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # 让 appimagetool 自解压运行，避免依赖宿主机 FUSE 挂载能力
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # 不设 ELECTRON_MIRROR / ELECTRON_BUILDER_BINARIES_MIRROR：
          # GitHub runner 直连 GitHub Releases 最快，走国内镜像反而容易超时或缺包。

      - name: Collect distributables
        shell: bash
        # 收敛到扁平目录，让 artifact 与 Release 里的文件都是干净的顶层文件
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(electron/release/*/*.dmg electron/release/*/*.zip \
                 electron/release/*/*.AppImage electron/release/*/*.deb \
                 electron/release/*/*.exe)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::electron/release/ 下没有找到任何可分发安装包"
            exit 1
          fi
          mkdir -p dist-out
          cp "${files[@]}" dist-out/
          ls -lh dist-out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openprd-${{ matrix.id }}
          path: dist-out/
          if-no-files-found: error
          # dmg / zip / AppImage / deb 本身已是压缩格式，二次压缩只浪费时间
          compression-level: 0
          retention-days: 30
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openprd-*
          path: dist-artifacts
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-artifacts -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::没有找到可发布的安装包"
            exit 1
          fi
          sha256sum "${files[@]}" | sed 's#dist-artifacts/##' > SHA256SUMS.txt
          files+=(SHA256SUMS.txt)
          echo "发布 ${#files[@]} 个文件到 $TAG"
          printf '  %s\n' "${files[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "OpenPRD $TAG" --generate-notes --verify-tag
          fi
